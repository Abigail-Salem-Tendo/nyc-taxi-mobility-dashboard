<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NYC Taxi Mobility Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="hero">
        <h1>NYC Taxi Mobility Dashboard</h1>
        <p>System-wide statistics and algorithmic zone analysis</p>
    </header>

    <!--STATISTICS SECTION -->
    <section class="section">
        <h2>System Statistics</h2>
        <div id="statsContainer" class="stats-grid">
        </div>
    </section>

    <!-- PICKUP ZONES -->
    <section class="section">
        <h2>Top Pickup Zones</h2>
        <div class="table-controls">
            <label>Limit:
                <input type="number" id="pickupLimit" value="10" min="1" max="50">
            </label>
            <button onclick="loadPickupZones()">Load</button>
        </div>
        <table id="pickupTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Zone</th>
                    <th>Trips</th>
                    <th>% of Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
